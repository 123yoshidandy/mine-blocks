<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINE BLOCKS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MINE BLOCKS</h1>
        </header>

        <div class="game-container">
            <div class="top-controls">
                <div class="stats">
                    <div class="score">スコア: <span id="score">0</span></div>
                    <div class="timer">経過時間: <span id="timerDisplay">0</span>秒</div>
                </div>
                <div class="buttons">
                    <button id="newGame">新しいゲーム</button>
                    <button id="hint">ヒント</button>
                </div>
            </div>

            <div class="game-board" id="gameBoard">
                <!-- ゲームボードはJavaScriptで動的に生成されます -->
            </div>

            <div class="blocks-container" id="blocksContainer">
                <!-- ブロックはJavaScriptで動的に生成されます -->
            </div>
        </div>

        <div class="modal" id="clearModal">
            <div class="modal-content">
                <h2>クリア！</h2>
                <p>クリア時間: <span id="clearTime">0</span>秒</p>
                <p>獲得スコア: <span id="earnedScore">0</span>点</p>
                <p>合計スコア: <span id="currentScore">0</span>点</p>
                <button id="nextGame">次のゲーム</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
